# Render Blueprint: the whole app on Render.
#   - murtuza-truck-routing-api : Django API (Docker web service, free plan, sleeps when idle)
#   - murtuza-truck-routing     : React frontend (static site on Render's CDN, never sleeps)
# The frontend calls the API origin directly; CORS on the API allows the frontend origin.
# Deploy: https://render.com/deploy?repo=https://github.com/murtuza777/spotter_labs_assessment
services:
  - type: web
    name: murtuza-truck-routing-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    envVars:
      - key: TOMTOM_API_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://murtuza-truck-routing.onrender.com
      - key: CACHE_URL
        value: filecache:///tmp/planner-cache
      # Photon refuses connections from Render's network; TomTom Search answers first.
      - key: GEOCODER_ORDER
        value: tomtom,photon
      # Weather providers, tried in order: WeatherAPI.com first, then the US National Weather
      # Service for any cell or missing value it couldn't supply (docs/WEATHER_PROVIDERS.md).
      # WeatherAPI is skipped while its key is empty; NWS needs no key.
      - key: WEATHER_PROVIDERS
        value: weatherapi,nws
      # WeatherAPI.com key (primary provider). Secret: set it in the Dashboard.
      - key: WEATHERAPI_KEY
        sync: false
      # Forecast days your WeatherAPI plan allows: Free 3, Starter 7.
      - key: WEATHERAPI_DAYS
        value: "3"
      # NWS asks every client for a User-Agent naming the app and a contact. The default is
      # "truck-weather-routing/1.0 (+<repo URL>)"; set NWS_USER_AGENT to override it.
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: murtuza-truck-routing
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        value: https://murtuza-truck-routing-api.onrender.com
      - key: NODE_VERSION
        value: "24"
