# Render Blueprint: the whole app on Render.
#   - murtuza-truck-routing-api : Django API (Docker web service, free plan, sleeps when idle)
#   - murtuza-truck-routing     : React frontend (static site on Render's CDN, never sleeps)
# The frontend calls the API origin directly; CORS on the API allows the frontend origin.
# Deploy: https://render.com/deploy?repo=https://github.com/murtuza777/spotter_labs_assessment
services:
  - type: web
    name: murtuza-truck-routing-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    envVars:
      - key: TOMTOM_API_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://murtuza-truck-routing.onrender.com
      - key: CACHE_URL
        value: filecache:///tmp/planner-cache
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: murtuza-truck-routing
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        value: https://murtuza-truck-routing-api.onrender.com
      - key: NODE_VERSION
        value: "24"
