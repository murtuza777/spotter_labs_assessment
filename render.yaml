# Render Blueprint for the Django API. New > Blueprint > pick this repo; set TOMTOM_API_KEY
# and CORS_ALLOWED_ORIGINS (your Vercel URL) when prompted.
services:
  - type: web
    name: truck-weather-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    envVars:
      - key: TOMTOM_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CACHE_URL
        value: filecache:///tmp/planner-cache
      - key: WEB_CONCURRENCY
        value: "2"
